spring.application.name=apotheca

# Local defaults (docker-compose.yml); production sets SPRING_DATASOURCE_* environment variables.
spring.datasource.url=jdbc:postgresql://localhost:5432/apotheca
spring.datasource.username=apotheca
spring.datasource.password=apotheca

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

apotheca.time-zone=America/Sao_Paulo

apotheca.firebase.project-id=apotheca-dev-e2f60
spring.security.oauth2.resourceserver.jwt.issuer-uri=https://securetoken.google.com/${apotheca.firebase.project-id}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=https://www.googleapis.com/service_accounts/v1/jwk/securetoken@system.gserviceaccount.com
spring.security.oauth2.resourceserver.jwt.audiences=${apotheca.firebase.project-id}

apotheca.cors.allowed-origins=http://localhost:4200
